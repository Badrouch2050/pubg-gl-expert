  document.getElementById("reqList").innerHTML = t.req.map(function(s){ return "<li>"+esc(s)+"</li>"; }).join("");

  var html = '<div class="prep"><h3>'+esc(t.prepTitle)+'</h3><ul>'+t.prep.map(function(p){return "<li>"+esc(p)+"</li>";}).join("")+'</ul></div>';
  html += t.guide.map(function(g,i){
    var note = g[4] ? '<div class="note'+(i===2||i===4?' warn':'')+'">'+esc(g[4])+'</div>' : "";
    return '<article class="step"><div class="num">'+(i+1)+'</div><div><h3>'+esc(g[0])+(g[1]?'<span class="tag">'+esc(t.optional)+'</span>':'')+'</h3><p>'+esc(g[2])+'</p><ul>'+g[3].map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul>'+note+'</div></article>';
  }).join("");
  document.getElementById("steps").innerHTML = html;

  document.getElementById("tipsList").innerHTML = t.tips.map(function(x){
    return '<div class="tip"><div><b>'+esc(x[0])+' : <span class="val">'+esc(x[1])+'</span></b><span>'+esc(x[2])+'</span></div></div>';
  }).join("");

  document.getElementById("faqList").innerHTML = t.faq.map(function(q){
    return '<details><summary>'+esc(q[0])+'</summary><p>'+esc(q[1])+'</p></details>';
  }).join("");

  try { localStorage.setItem("pglx-lang", lang); } catch(e) {}
}

document.querySelectorAll(".langs button").forEach(function(b){
  b.addEventListener("click", function(){ render(b.getAttribute("data-lang")); });
});
document.querySelectorAll(".js-dl").forEach(function(a){
  a.setAttribute("href", DOWNLOAD_URL);
  if (/^https?:/.test(DOWNLOAD_URL)) { a.setAttribute("target","_blank"); a.setAttribute("rel","noopener"); }
});
document.querySelectorAll(".js-discord").forEach(function(a){ a.setAttribute("href", DISCORD_URL); });

var start = "fr";
try { start = localStorage.getItem("pglx-lang") || ""; } catch(e) { start = ""; }
if (!T[start]) {
  var nl = (navigator.language || "fr").slice(0,2).toLowerCase();
  start = T[nl] ? nl : "fr";
}
render(start);
</script>
</body>
</html>
